<body>

    <div class="bar2" id="hpb"><i></i><span></span></div><div class="bar2" id="mpb"><i></i><span></span></div></div>

  <div id="sprintBar"><i id="sprintFill"></i></div>
</div>

  <button class="btn" data-k="KeyE">E</button><button class="btn" data-k="KeyR">R</button><button class="btn" data-k="KeyT">T</button>

<div id="win"></div>
<div id="fade"></div>

  <button class="btn" id="bStory">📜 القصة</button>
  <button class="btn" id="bCtrl">🎮 التحكم</button>
  <button class="btn" id="bChar">🧍 شخصيتك (Mixamo / GLB)</button>
  <button class="btn" id="bSet">⚙ الإعدادات</button>
  <div class="tiny">الخامات: ambientCG (CC0) — صُنعت لـ Eslam</div>
</div></div>
